<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Guía de enseñanza</title>

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>
    <header class="hero">
        <nav class="topbar" aria-label="Navegación principal">
            <div class="brand" aria-label="Marca de Guía de enseñanza">
                <span class="brand-mark">GU</span>
                <span>Guía de enseñanza</span>
            </div>
            <div class="topbar-actions">
                <span class="badge">Material didáctico</span>
                <span class="badge muted">Contenido interactivo</span>
            </div>
        </nav>

        <div class="hero-content">
            <span class="eyebrow">Aprendizaje visual y auditivo</span>
            <h1>Una experiencia clara para explorar y aprender.</h1>
            <p>Recorre el material con una interfaz sobria, audiovisual y fácil de usar.</p>
            <div class="hero-actions">
                <a href="#pdf-content" class="btn btn-primary">Ver contenido</a>
            </div>
        </div>
    </header>
    <aside class="page-jump" aria-label="Ir a una página">
        <form id="page-jump-form" class="page-jump-form">
            <label class="page-jump-label" for="page-jump-input">Ir a página</label>
            <div class="page-jump-row">
                <input id="page-jump-input" class="page-jump-input" type="number" min="1" step="1" inputmode="numeric" placeholder="1" disabled>
                <button class="btn btn-primary page-jump-button" type="submit" disabled>Ir</button>
            </div>
            <p id="page-jump-status" class="page-jump-status" aria-live="polite">Cargando documento...</p>
        </form>
    </aside>
    <main>
        <div id="pdf-content"></div>
    </main>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="../javascript/app.js"></script>
</body>

</html>
